services:
  db:
    image: postgres:16-alpine
    container_name: apartman-postgres
    environment:
      POSTGRES_USER: apartman
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: apartman
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - apartman_db_data:/var/lib/postgresql/data

volumes:
  apartman_db_data:
